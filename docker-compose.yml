# Postgres now lives in Supabase — set DATABASE_URL in .env to your Supabase
# connection string. Use the port-6543 pooled URL for the app; use the direct
# port-5432 URL when running Alembic migrations (see backend/app/db/migrations/env.py).

services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/veritas-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4jdata:
